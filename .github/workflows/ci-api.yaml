name: CI - todos-api

on:
  push:
    branches: [main]
    paths:
      - 'todolist-api/**'

env:
  IMAGE: ghcr.io/nadav602/todos-api

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: nadav602
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./todolist-api
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update k8s repo
        run: |
          TAG=${{ needs.build-scan-push.outputs.tag }}
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/nadav602/k8s.git
          cd k8s
          yq e ".api.image.tag = \"${TAG}\"" -i todolist-chart/values.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add todolist-chart/values.yaml
          git commit -m "ci: update todos-api image tag to ${TAG}"
          git push
